<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradient viền bong bóng chat ngoài -->
    <linearGradient id="bubbleBorder" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E62D0" />
      <stop offset="25%" stop-color="#00A2F3" />
      <stop offset="70%" stop-color="#3CD3BE" />
      <stop offset="100%" stop-color="#60DC91" />
    </linearGradient>

    <!-- Gradient mặt robot -->
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F58BF" />
      <stop offset="50%" stop-color="#0B409E" />
      <stop offset="100%" stop-color="#083080" />
    </linearGradient>

    <!-- Hiệu ứng phát sáng cho mắt -->
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#7BE9FF" />
      <stop offset="80%" stop-color="#179BEE" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0072CE" stop-opacity="0" />
    </radialGradient>

    <!-- Hiệu ứng blur mềm cho ánh sáng mắt -->
    <filter id="glowBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Viền bong bóng hội thoại ngoài -->
  <path d="M 260 70 
           A 170 170 0 0 1 428 250 
           C 426 345 348 420 252 420 
           C 228 420 205 415 184 406 
           C 165 417 142 425 120 427 
           C 126 411 131 393 133 375 
           C 95 342 72 294 72 240 
           A 170 170 0 0 1 260 70 Z" 
        fill="none" 
        stroke="url(#bubbleBorder)" 
        stroke-width="32" 
        stroke-linejoin="round" 
        stroke-linecap="round" />

  <!-- Đầu robot -->
  <rect x="175" y="180" width="170" height="135" rx="55" ry="55" fill="url(#headGrad)" />

  <!-- Mắt trái phát sáng -->
  <circle cx="218" cy="235" r="22" fill="url(#eyeGlow)" filter="url(#glowBlur)" />
  <circle cx="218" cy="235" r="9" fill="#E6FAFF" />

  <!-- Mắt phải phát sáng -->
  <circle cx="302" cy="235" r="22" fill="url(#eyeGlow)" filter="url(#glowBlur)" />
  <circle cx="302" cy="235" r="9" fill="#E6FAFF" />

  <!-- Nụ cười robot -->
  <path d="M 230 268 Q 260 288 290 268" 
        fill="none" 
        stroke="#7BE9FF" 
        stroke-width="7" 
        stroke-linecap="round" />
</svg>
